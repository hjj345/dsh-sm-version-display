# dsh-sm-version-display bundle patch.
# Mounts this plugin into the profile layer stack. The loader then instantiates
# the host half (lib/index.js) and the client-modules scan picks up the
# `dsh.client` declaration, so /plugins/dsh-sm-version-display/client.js is served
# and loaded in the web page.
- insert:
    - id: dsh-sm-version-display
      name: 'dsh-sm-version-display'
