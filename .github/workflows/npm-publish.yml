name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version in package.json to publish from master
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            [[ "$GITHUB_REF" == "refs/heads/master" ]] || { echo "Manual publish must run from master"; exit 1; }
            release_version="$INPUT_VERSION"
          fi
          [[ "$release_version" == "$package_version" ]] || {
            echo "Release version $release_version does not match package.json $package_version"
            exit 1
          }

      - run: npm run build
      - run: npm test
      - run: npm publish --access public
